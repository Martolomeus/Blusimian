# Local Postgres for the Blusimian backend.
#
# This replaces the manually-created `blusimian-db` container. The schema is NOT
# defined here -- Flyway runs the migrations in src/main/resources/db/migration
# on every backend startup, so this is just a plain Postgres 16 instance.
#
#   docker compose up -d     start Postgres in the background
#   docker compose down      stop and remove the container (data is KEPT)
#   docker compose down -v    stop and ALSO wipe the data volume (full reset)
#
# Connection details match src/main/resources/application.properties: host
# localhost, port 5434, db blusimian. docker/initdb creates the roles on an empty
# volume: blusimian_owner (Flyway) and blusimian_app (the app; RLS applies).
# postgres/blusimian is the superuser, for `make db-shell` only.

# Fixed project name, so the volume name doesn't depend on the folder name.
name: blusimian

services:
  db:
    image: postgres:16
    container_name: blusimian-db          # keeps `make db-shell` / `make db-reset` working
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: blusimian
      POSTGRES_DB: blusimian
    ports:
      - "5434:5432"                        # host 5434 -> container 5432
    volumes:
      - blusimian-db-data:/var/lib/postgresql/data
      # Runs once, on an empty volume. Volumes created before it need `down -v`.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    # Lets `docker compose up --wait` (and dependents) block until Postgres is
    # actually accepting connections, not just until the container starts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blusimian"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  blusimian-db-data:
