spring.application.name=Blusimian

# --- Database connection (the Postgres container on port 5434) ---
# currentSchema=app,public: tenant-scoped tables live in the "app" schema (the
# default for unqualified names); "public" stays in the search path for global
# reference data (iso_countries).
spring.datasource.url=jdbc:postgresql://localhost:5434/blusimian?currentSchema=app,public
# The runtime role: owns nothing and can't bypass RLS (docker/initdb/01-roles.sql).
spring.datasource.username=blusimian_app
spring.datasource.password=blusimian_app

# --- Flyway ---
# Runs the SQL files in src/main/resources/db/migration on every startup.
# Enabled by default once flyway is on the classpath; listed here for clarity.
spring.flyway.enabled=true
# Manage the app schema and keep Flyway's history table there.
spring.flyway.schemas=app
spring.flyway.default-schema=app
# With a user set, Boot gives Flyway its own connection (same URL) as the owner.
spring.flyway.user=blusimian_owner
spring.flyway.password=blusimian_owner

# --- JPA / Hibernate ---
# Flyway owns the schema, so Hibernate must NOT create or alter tables.
# 'validate' just checks the entities match the existing schema at startup.
spring.jpa.hibernate.ddl-auto=validate
# Tenant-scoped entities live in the "app" schema; reference entities override
# this with an explicit @Table(schema = "public").
spring.jpa.properties.hibernate.default_schema=app
# Don't keep a DB session open for the whole web request (avoids lazy-loading
# surprises and frees connections sooner).
spring.jpa.open-in-view=false

# --- Session (the minimal login, Architecture/multitenancy.md) ---
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# Dev: survive devtools restarts instead of logging everyone out.
server.servlet.session.persistent=true

# --- Dev data ---
# Provisions the Acme (alice/alice) and Globex (bob/bob) tenants if missing.
blusimian.demo-tenants.enabled=true

# --- Logging (helpful while learning) ---
# The SQL Hibernate generates (both contacts and companies are now JPA), formatted:
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
